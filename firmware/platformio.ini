; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; 115200 matches the ESP32's default boot-log baud rate, so you see
; the ROM bootloader output and your own Serial.print output at the
; same speed without reconfiguring your terminal mid-boot.
monitor_speed = 115200

; Decodes raw addresses in a crash backtrace (e.g. after a panic/reboot)
; into function names and file:line, straight in the serial monitor.
; Without this, a crash just prints a wall of hex you'd have to decode
; by hand with addr2line.
monitor_filters = esp32_exception_decoder

; M3: enables ESPAsyncWebServer's regex URL matching ("^...$" patterns
; + request->pathArg(n)), used for the preset-name-parameterized REST
; routes (GET/PUT/DELETE /api/v1/presets/:name, etc. -- see
; firmware/src/main.cpp's setupApiRoutes()). Without this flag those
; patterns are matched as inert literal strings and never match a real
; request.
build_flags =
    -DASYNCWEBSERVER_REGEX

; M3: OTA needs two app-image slots, which the default esp32dev
; partition table doesn't have. min_spiffs.csv is a scheme bundled
; with the arduino-esp32 core itself (not a custom file this repo
; maintains): two ~1.9MB OTA app slots + ~190KB filesystem -- more
; than enough for config.json's tiny axis config + presets.
; board_build.filesystem must be set explicitly alongside it: without
; it, LittleFS.begin() can silently target the wrong partition type
; depending on the arduino-esp32 core version's own default, rather
; than failing loudly at compile time.
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs

lib_deps =
    gin66/FastAccelStepper
    ; M2: config.json persistence (schema_version, axis config, named
    ; presets). ArduinoJson is the standard JSON library for
    ; Arduino/ESP32 -- no real competing option in this ecosystem.
    ; LittleFS itself needs no separate lib_dep: it ships built into
    ; framework-arduinoespressif32.
    bblanchon/ArduinoJson@^7
    ; M3: WiFi provisioning -- tries saved credentials, falls back to
    ; its own AP + captive portal if none work. Chosen over a
    ; hand-rolled captive portal (see docs/api.md) to avoid getting
    ; DNS-redirect/portal edge cases right by hand.
    tzapu/WiFiManager@^2.0.17
    ; M3: async web server + WebSocket. The original me-no-dev
    ; ESPAsyncWebServer is stale; ESP32Async is the actively-maintained
    ; continuation (same maintainer as the mathieucarbou fork Josh
    ; confirmed -- that repo has since moved/archived under this org
    ; name). Chosen over the synchronous built-in Arduino WebServer,
    ; which would block loop() per-request and jitter controlTick()'s
    ; 20ms S-curve velocity-following.
    ESP32Async/ESPAsyncWebServer@^3.6.0
    ESP32Async/AsyncTCP@^3.3.2

; A second, hardware-free environment for lib/motion's unit tests
; (`pio test -e native`). It builds with the host's own compiler
; instead of the ESP32 toolchain, so tests run in seconds with no
; board, no upload, no serial port -- lib/motion has no Arduino/WiFi
; dependency specifically so this is possible. test_build_src=no
; keeps firmware/src out of a `pio test` run here; build_src_filter
; additionally keeps it out of a plain `pio run` (e.g. clicking
; PlatformIO's generic "Build" button, which builds every environment
; in this file, not just esp32dev) -- without it, `pio run` tries to
; compile firmware/src/main.cpp (Arduino.h/FastAccelStepper.h, both
; ESP32-only) and the Arduino-dependent parts of firmware/lib/config
; and firmware/lib/api against the host compiler, which can never work
; and isn't what this environment is for. Only firmware/test and
; firmware/lib/motion (no Arduino/WiFi deps) compile here.
[env:native]
platform = native
build_flags = -std=gnu++17
test_build_src = no
build_src_filter = -<*>
