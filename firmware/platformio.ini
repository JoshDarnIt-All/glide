; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; 115200 matches the ESP32's default boot-log baud rate, so you see
; the ROM bootloader output and your own Serial.print output at the
; same speed without reconfiguring your terminal mid-boot.
monitor_speed = 115200

; Decodes raw addresses in a crash backtrace (e.g. after a panic/reboot)
; into function names and file:line, straight in the serial monitor.
; Without this, a crash just prints a wall of hex you'd have to decode
; by hand with addr2line.
monitor_filters = esp32_exception_decoder

lib_deps =
    gin66/FastAccelStepper
